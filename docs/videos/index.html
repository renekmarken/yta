<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Video Library · Secret</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--fg:#14161b;--muted:#5d6472;--line:#e3e6eb;
  --accent:#2f6bff;--accent-fg:#ffffff;--good:#13a454;--mid:#c98a00;--bad:#d93a3a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);--radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014;--surface:#171a20;--surface-2:#1f232b;--fg:#eef0f4;--muted:#9aa2b1;--line:#2a2f39;
  --accent:#5b8cff;--accent-fg:#0b0d12;--good:#2fd07a;--mid:#f0b429;--bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:28px;line-height:1.15;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
.search{flex:0 1 320px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2)}
.card .body{padding:12px 14px 14px}
.card h2{font-size:16px;line-height:1.3;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:600;font-size:12px;
  background:var(--surface-2);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%}
.done-badge{background:var(--good);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--muted)}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font:inherit;font-weight:600;
  cursor:pointer;padding:6px 0;margin-bottom:12px}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel .pad{padding:16px}
.big-title{font-size:22px;line-height:1.25;margin:0 0 10px}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.variant{margin:0;display:flex;flex-direction:column;gap:6px}
.variant .thumb{border-radius:10px;cursor:pointer;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .15s}
.variant.sel .thumb{outline-color:var(--accent)}
.variant .btn{padding:8px 6px;font-size:13px;border-radius:10px}
.variant .btn svg{width:15px;height:15px}
.vhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:14px}
.vhead span{color:var(--muted);font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;font-weight:650;
  text-decoration:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);grid-column:1/-1;font-size:16px;padding:14px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.field{margin-bottom:16px}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.field label{font-weight:700;font-size:14px}
.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:700}
.copy{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;min-width:84px}
.copy.ok{background:var(--good);border-color:var(--good);color:#fff}
.box{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--fg);
  padding:11px 12px;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;resize:vertical}
textarea.box{min-height:90px}
textarea.box.desc{min-height:260px}
.checks{margin:0;padding-left:20px;color:var(--fg)}
.checks li{margin:4px 0}
.mark{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;cursor:pointer}
.mark input{width:20px;height:20px;accent-color:var(--good)}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.btn.yt{grid-column:1/-1;background:#e5252a;border-color:#e5252a;color:#fff}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top-actions[hidden]{display:none}
.gen{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:0;background:var(--accent);
  color:var(--accent-fg);font:inherit;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer}
.status{display:none;margin-bottom:18px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);align-items:center;gap:12px;font-size:15px}
.status.on{display:flex}
.xbtn{margin-left:auto;border:0;background:none;color:inherit;font-size:16px;cursor:pointer;padding:2px 6px;opacity:.7}
.xbtn:hover{opacity:1}
.done-list{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.done-list summary{cursor:pointer;font-weight:750;font-size:16px;list-style:none;display:flex;align-items:center;gap:10px;
  padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:max-content;max-width:100%}
.done-list summary::-webkit-details-marker{display:none}
.done-list summary::before{content:"▸";transition:transform .15s;display:inline-block}
.done-list[open] summary::before{transform:rotate(90deg)}
.done-list[open] summary{margin-bottom:18px}
.done-list .count{color:var(--muted);font-weight:600}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{min-height:70vh;display:grid;place-items:center}
.lock-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
.lock-card h1{font-size:24px;margin:0 0 6px}
.lock-card input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--fg);font:inherit;font-size:17px;margin:16px 0 10px}
.lock-card .gen{width:100%;justify-content:center;padding:13px}
.err{color:var(--bad);font-weight:600;min-height:22px;margin:8px 0 0;font-size:14px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:24px;width:min(420px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:21px}
.num{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.num button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:24px;cursor:pointer}
.num input{flex:1;min-width:0;text-align:center;font:inherit;font-size:30px;font-weight:800;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.row{display:flex;gap:10px;margin-top:18px}
.row > *{flex:1}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 14px}
.qhead h2{margin:0;font-size:22px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;
  border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.qrank{font-size:20px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.qname{font-weight:750;font-size:16.5px;color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.qname:hover{text-decoration:underline}
.qwhy{margin:4px 0 6px;color:var(--fg);opacity:.85;font-size:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:12.5px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.badge.launch{background:#ff5a1f;border-color:#ff5a1f;color:#fff}
.qmake{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
  font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.qmake:hover{border-color:var(--accent)}
.qmake[disabled]{opacity:.5;cursor:default}
@media (max-width:600px){.qitem{grid-template-columns:30px minmax(0,1fr)}.qmake{grid-column:2;justify-self:start}}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Video Library</h1>
      <p class="sub" id="sub">Your finished review videos, ready to upload.</p>
    </div>
    <div class="top-actions" id="actions" hidden>
      <input class="search" id="search" type="search" placeholder="Search videos…" aria-label="Search videos">
      <button class="ghost" id="queuebtn" title="Products waiting to be reviewed">Queue</button>
      <button class="gen" id="gen">＋ Generate new videos</button>
      <button class="ghost" id="lockbtn" title="Lock this page on this device">Lock</button>
    </div>
  </header>
  <div class="status" id="status" role="status"></div>
  <main id="app"></main>
</div>

<dialog id="dlg">
  <h2>Generate new videos</h2>
  <p class="sub" style="margin:0">Picks the next products from the queue (never one that was already reviewed).</p>
  <label for="count" style="display:block;font-weight:700;margin-top:18px">How many videos from the queue?</label>
  <div class="num">
    <button type="button" data-step="-1" aria-label="Fewer">−</button>
    <input id="count" type="number" min="0" max="30" value="3" inputmode="numeric">
    <button type="button" data-step="1" aria-label="More">+</button>
  </div>
  <label for="custom" style="display:block;font-weight:700;margin-top:14px">Also review a specific website
    <span style="font-weight:500;color:var(--muted)">(optional)</span></label>
  <input id="custom" class="box" type="url" inputmode="url" autocomplete="off" spellcheck="false"
         placeholder="e.g. https://www.example.com" style="width:100%;margin-top:6px">
  <p class="hint" style="margin-top:6px">Made in addition to the queue videos (set the number above to 0 to make only this one).</p>
  <label for="parallel" style="display:block;font-weight:700;margin-top:14px">At the same time</label>
  <select id="parallel"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
  <p class="hint" id="eta"></p>
  <p class="err" id="dlgerr"></p>
  <div class="row">
    <button type="button" class="ghost" id="cancel">Cancel</button>
    <button type="button" class="gen" id="start" style="justify-content:center">Start</button>
  </div>
</dialog>

<script>
const ICON = {
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>'
};
const LIMITS = {title: 100, description: 5000, tags: 500, pinned: 10000};
let videos = [];
let dispatch = null;
let unlocked = false;
let libKey = null, vaultBase = "";
const blobCache = {};
let box = null;            // the encrypted file
const enc = new TextEncoder(), dec = new TextDecoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const uploaded = id => store.get("uploaded:" + id) === "1";
const verdictColor = v => v === "Worth it" ? "var(--good)" : v === "Not worth it" ? "var(--bad)" : "var(--mid)";
const fmtDate = d => { try { return new Date(d + "T12:00:00").toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"}); } catch { return d; } };
const tagsText = v => (v.tags || []).join(", ");

async function deriveKey(password){
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: unb64(box.salt), iterations: box.iter},
                                 base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function openBox(key){
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(box.iv)}, key, unb64(box.data));
  const payload = JSON.parse(dec.decode(plain));
  videos = payload.videos || [];
  dispatch = payload.dispatch || null;
  vaultBase = (payload.vault && payload.vault.base) || "";
  libKey = key;
}

function lockScreen(msg){
  unlocked = false;
  document.getElementById("actions").hidden = true;
  document.getElementById("sub").textContent = "This page is locked.";
  document.getElementById("app").innerHTML = `
    <div class="lock"><form class="lock-card" id="lockform">
      <h1>🔒 Enter password</h1>
      <p class="sub">The video library is private.</p>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
      <label class="mark" style="margin:0 0 14px;font-weight:500"><input type="checkbox" id="remember" checked> Remember on this device</label>
      <button class="gen" type="submit">Unlock</button>
      <p class="err" id="pwerr">${esc(msg || "")}</p>
    </form></div>`;
  document.getElementById("pw").focus();
}

async function unlock(password, remember){
  const key = await deriveKey(password);
  await openBox(key);                                   // throws if the password is wrong
  if (remember) store.set("lib-key", tob64(await crypto.subtle.exportKey("raw", key)) + "|" + box.salt);
  ready();
}

async function load(){
  try {
    const r = await fetch("library.enc.json?t=" + Date.now(), {cache: "no-store"});
    box = r.ok ? await r.json() : null;
  } catch { box = null; }
  if (!box) { document.getElementById("app").innerHTML = `<div class="empty">The library could not be loaded. Try again in a minute.</div>`; return; }
  const saved = (store.get("lib-key") || "").split("|");
  if (saved[0] && saved[1] === box.salt) {
    try {
      const key = await crypto.subtle.importKey("raw", unb64(saved[0]), {name: "AES-GCM"}, false, ["decrypt"]);
      await openBox(key);
      return ready();
    } catch { store.set("lib-key", null); }
  }
  lockScreen();
}

function updateSub(){
  const todo = videos.filter(v => !isUploaded(v)).length;
  document.getElementById("sub").textContent = videos.length
    ? `${todo} to upload · ${videos.length - todo} uploaded · newest first. Click one to download it and copy its text.`
    : "Your finished review videos, ready to upload.";
}

function ready(){
  unlocked = true;
  document.getElementById("actions").hidden = false;
  updateSub();
  route();
  checkRuns();
}

const isUploaded = v => uploaded(v.id) || !!v.youtube || !!v.uploaded;
const card = v => `
    <button class="card" data-id="${esc(v.id)}" aria-label="${esc(v.title)}">
      ${v.files?.thumbnail ? `<img class="thumb" data-enc="${esc(refPath(v.files.thumbnail))}" alt="">` : `<div class="thumb"></div>`}
      <div class="body">
        <h2>${esc(v.title)}</h2>
        <div class="meta">
          <span>${esc(fmtDate(v.date))}</span>
          ${v.verdict ? `<span class="pill"><span class="dot" style="background:${verdictColor(v.verdict)}"></span>${esc(v.verdict)}${v.score !== "" ? " · " + esc(v.score) : ""}</span>` : ""}
          ${isUploaded(v) ? `<span class="pill done-badge">Uploaded</span>` : ""}
        </div>
      </div>
    </button>`;

function grid(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = videos.filter(v => !q || (v.title + " " + v.brand + " " + v.site).toLowerCase().includes(q));
  if (!videos.length) return `<div class="empty"><strong>No videos yet.</strong><br>
      Run <em>Actions → Produce review videos</em> (or <em>Make a batch of videos</em>) on GitHub.
      New videos appear here a few minutes after the run finishes.</div>`;
  if (!list.length) return `<div class="empty">No videos match “${esc(q)}”.</div>`;
  const todo = list.filter(v => !isUploaded(v)), done = list.filter(isUploaded);
  return (todo.length ? `<div class="grid">${todo.map(card).join("")}</div>`
                      : `<div class="empty">${q ? "No new videos match." : "All caught up: every video is uploaded."}</div>`) +
    (done.length ? `
    <details class="done-list" id="donelist"${store.get("show-uploaded") === "1" ? " open" : ""}>
      <summary>Already uploaded <span class="count">${done.length}</span></summary>
      <div class="grid">${done.map(card).join("")}</div>
    </details>` : "");
}

function field(key, label, value, kind){
  const big = kind === "description";
  const tag = kind === "title" ? `<input class="box" id="f-${key}" readonly value="${esc(value)}">`
                               : `<textarea class="box${big ? " desc" : ""}" id="f-${key}" readonly>${esc(value)}</textarea>`;
  const n = [...value].length, limit = LIMITS[kind];
  return `<div class="field">
    <div class="field-head">
      <label for="f-${key}">${label}</label>
      <span style="display:flex;align-items:center;gap:10px">
        <span class="count${n > limit ? " over" : ""}">${n.toLocaleString()} / ${limit.toLocaleString()}</span>
        <button class="copy" data-copy="f-${key}">Copy</button>
      </span>
    </div>${tag}</div>`;
}

function detail(v){
  const f = v.files || {};
  const thumbs = f.thumbnails || (f.thumbnail ? [f.thumbnail] : []);
  const dl = (kind, text, primary) => f[kind]
    ? `<button class="btn${primary ? " primary" : ""}" data-dl="${kind}">${ICON.down}<span>${text}</span></button>`
    : `<span class="btn${primary ? " primary" : ""}" aria-disabled="true">${ICON.down}${text}</span>`;
  return `
    <button class="back" id="back">${ICON.back} All videos</button>
    <div class="detail">
      <div>
        <div class="panel">
          ${thumbs.length ? `<img class="thumb" id="bigthumb" data-enc="${esc(refPath(thumbs[0]))}" alt="Thumbnail">` : ""}
          <div class="pad">
            <h2 class="big-title">${esc(v.title)}</h2>
            <div class="meta">
              <span>${esc(fmtDate(v.date))}</span>
              ${v.verdict ? `<span class="pill"><span class="dot" style="background:${verdictColor(v.verdict)}"></span>${esc(v.verdict)}${v.score !== "" ? " · " + esc(v.score) + "/10" : ""}</span>` : ""}
            </div>
            <div class="downloads">
              ${dl("video", "Download video (MP4)" + (f.video && f.video.size ? ` · ${Math.round(f.video.size / 1048576)} MB` : ""), true)}
              ${thumbs.length > 1 ? "" : dl("thumbnail", "Thumbnail")}
              ${dl("captions", "Captions (SRT)")}
            </div>
            ${thumbs.length > 1 ? `<div class="vhead"><strong>Thumbnail options</strong><span>Tap to preview · option 1 matches the title</span></div>
            <div class="variants">${thumbs.map((t, i) => `
              <figure class="variant${i ? "" : " sel"}">
                <img class="thumb" data-enc="${esc(refPath(t))}" data-pick="${i}" alt="Thumbnail option ${i + 1}">
                <button class="btn" data-dl="thumbnails" data-i="${i}">${ICON.down}<span>Option ${i + 1}</span></button>
              </figure>`).join("")}</div>` : ""}
            <div class="downloads" style="margin-top:10px">
              ${v.youtube ? `<a class="btn yt" href="${esc(v.youtube)}" target="_blank" rel="noopener">▶ Open on YouTube</a>`
                          : `<button class="btn yt" id="ytup">▶ Upload to YouTube</button>`}
            </div>
            <p class="hint">In YouTube Studio: upload the MP4, set the thumbnail you like best, and add the captions under
              Subtitles → Upload file → With timing.</p>
            ${(v.checks || []).length ? `<h3 style="font-size:15px;margin:18px 0 6px">Double-check before publishing</h3>
              <ul class="checks">${v.checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
            <label class="mark"><input type="checkbox" id="mark" ${uploaded(v.id) ? "checked" : ""}> I've uploaded this one</label>
          </div>
        </div>
      </div>
      <div class="panel"><div class="pad">
        ${field("title", "Title", v.title || "", "title")}
        ${field("desc", "Description", v.description || "", "description")}
        ${field("tags", "Tags", tagsText(v), "tags")}
        ${v.pinned_comment ? field("pin", "Pinned comment", v.pinned_comment, "pinned") : ""}
        ${f.kit ? `<button class="btn" data-dl="kit">${ICON.down}<span>Full upload kit (.md)</span></button>` : ""}
        ${v.expired ? `<p class="hint">The files of this older video were removed to save space.</p>` : ""}
        ${v.missing ? `<p class="hint">This video's files were lost in a storage error. Make it again with
          ＋ Generate new videos → “Also review a specific website”.</p>` : ""}
      </div></div>
    </div>`;
}

/* ---------- product queue (data/queue.json in the repository, refreshed by every discovery run) */
let queueData = null, queueErr = "";
function queueURL(){
  const ref = encodeURIComponent((dispatch && dispatch.ref) || "HEAD");
  const base = /\/vault\/$/.test(vaultBase) ? vaultBase.replace(/\/vault\/$/, "/")
             : "https://raw.githubusercontent.com/renekmarken/yta/";
  return base + ref + "/data/queue.json?t=" + Math.floor(Date.now() / 60000);
}
const ago = iso => {
  const h = (Date.now() - new Date(iso).getTime()) / 3600000;
  if (!isFinite(h)) return "";
  return h < 1 ? "just now" : h < 24 ? `${Math.floor(h)} h ago` : `${Math.floor(h / 24)} d ago`;
};
function queueBadge(it){
  const fresh = it.launch_seen && (Date.now() - new Date(it.launch_seen).getTime()) < 7 * 864e5;
  if (it.pinned) return `<span class="badge">📌 Added by you</span>`;
  if (fresh && it.launch === "today") return `<span class="badge launch">🚀 Launched today</span>`;
  if (fresh && it.launch === "this_week") return `<span class="badge launch">🚀 Launched this week</span>`;
  return it.evergreen ? `<span class="badge">🌲 Evergreen</span>` : `<span class="badge">🔥 Trending</span>`;
}
async function loadQueue(force){
  if (queueData && !force) return;
  try {
    const r = await fetch(queueURL(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    queueData = await r.json(); queueErr = "";
  } catch (e) { queueErr = "The queue could not be loaded (" + e.message + "). Try again in a minute."; }
}
function queueView(){
  if (!queueData) return queueErr ? `<div class="empty">${esc(queueErr)}</div>` : `<div class="empty"><span class="spinner"></span> Loading the queue…</div>`;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const all = Object.values(queueData.items || {})
    .sort((a, b) => (b.priority ?? b.hotness ?? 0) - (a.priority ?? a.hotness ?? 0));
  const list = all.map((it, i) => [i + 1, it])
    .filter(([, it]) => !q || `${it.name} ${it.url} ${it.cat || it.category} ${it.why}`.toLowerCase().includes(q));
  const launches = all.filter(it => it.launch && it.launch_seen && (Date.now() - new Date(it.launch_seen).getTime()) < 7 * 864e5).length;
  return `
    <button class="back" id="back">${ICON.back} All videos</button>
    <div class="qhead">
      <h2>Product queue</h2>
      <span class="sub">${all.length} waiting${launches ? ` · ${launches} new launch${launches === 1 ? "" : "es"}` : ""} ·
        updated ${esc(ago(queueData.updated))} · new launches go first, the top ones are made next</span>
    </div>
    ${list.length ? `<div class="qlist">${list.map(([n, it]) => `
      <div class="qitem">
        <div class="qrank">${n}</div>
        <div>
          <a class="qname" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a>
          ${it.why ? `<p class="qwhy">${esc(it.why)}</p>` : ""}
          <div class="qmeta">
            ${queueBadge(it)}
            <span>${esc(it.cat || it.category || "")}</span>
            ${it.hotness != null ? `<span>hotness ${esc(Math.round(it.hotness * 10) / 10)}</span>` : ""}
            ${(it.sources || []).length ? `<span>via ${esc(it.sources.join(", "))}</span>` : ""}
            ${it.added ? `<span>found ${esc(ago(it.added))}</span>` : ""}
          </div>
        </div>
        <button class="qmake" data-make="${esc(it.url)}" data-name="${esc(it.name)}">▶ Make now</button>
      </div>`).join("")}</div>` : `<div class="empty">${q ? `Nothing in the queue matches “${esc(q)}”.` : "The queue is empty. Discovery refills it every hour."}</div>`}`;
}

function route(){
  if (!unlocked) return;
  if (location.hash === "#queue") {
    document.getElementById("search").style.display = "";
    document.getElementById("search").placeholder = "Search the queue…";
    document.getElementById("app").innerHTML = queueView();
    if (!queueData && !queueErr) loadQueue().then(() => location.hash === "#queue" && route());
    return;
  }
  document.getElementById("search").placeholder = "Search videos…";
  const id = decodeURIComponent(location.hash.slice(1));
  const v = videos.find(x => x.id === id);
  const app = document.getElementById("app");
  document.getElementById("search").style.display = v ? "none" : "";
  app.innerHTML = v ? detail(v) : grid();
  if (v) window.scrollTo(0, 0);
  app.querySelectorAll("img[data-enc]").forEach(async img => {
    try { img.src = await fileURL(img.dataset.enc, "image/jpeg"); } catch {}
  });
}

document.addEventListener("click", async e => {
  const dis = e.target.closest("[data-dismiss]");
  if (dis) { store.set("dismissed-run", dis.dataset.dismiss); showStatus(""); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    document.querySelectorAll(".variant").forEach(el => el.classList.toggle("sel", el.contains(pick)));
    const big = document.getElementById("bigthumb");
    if (big && pick.src) big.src = pick.src;
    return;
  }
  const card = e.target.closest(".card");
  if (card) { location.hash = encodeURIComponent(card.dataset.id); return; }
  if (e.target.closest("#back")) { location.hash = ""; return; }
  if (e.target.closest("#queuebtn")) {
    queueErr = ""; queueData = null;
    if (location.hash === "#queue") route(); else location.hash = "queue";
    return;
  }
  const make = e.target.closest("[data-make]");
  if (make) {
    if (!dispatch || !dispatch.token) { alert("The button isn't connected yet (no GitHub token)."); return; }
    if (!confirm(`Make a video about ${make.dataset.name} now?`)) return;
    make.disabled = true; make.textContent = "Starting…";
    try {
      await runWorkflow("batch.yml", {count: "0", url: make.dataset.make, parallel: "1"});
      watching = "batch.yml";
      make.textContent = "Started ✓";
      showStatus(`<span class="spinner"></span> Starting a video about ${esc(make.dataset.name)}…`);
      setTimeout(checkRuns, 6000);
    } catch (err) { make.disabled = false; make.textContent = "▶ Make now"; alert("Couldn't start: " + err.message); }
    return;
  }
  const btn = e.target.closest(".copy");
  if (btn) {
    const el = document.getElementById(btn.dataset.copy);
    try { await navigator.clipboard.writeText(el.value); }
    catch { el.focus(); el.select(); document.execCommand && document.execCommand("copy"); }
    btn.textContent = "Copied ✓"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
  }
});
document.addEventListener("toggle", e => {
  if (e.target.id === "donelist") store.set("show-uploaded", e.target.open ? "1" : null);
}, true);
document.addEventListener("change", e => {
  if (e.target.id === "mark") {
    const id = decodeURIComponent(location.hash.slice(1));
    store.set("uploaded:" + id, e.target.checked ? "1" : null);
    updateSub();
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "lockform") return;
  e.preventDefault();
  const btn = e.target.querySelector("button"), err = document.getElementById("pwerr");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try { await unlock(document.getElementById("pw").value, document.getElementById("remember").checked); }
  catch { btn.disabled = false; btn.textContent = "Unlock"; err.textContent = "Wrong password. Try again."; }
});
document.getElementById("lockbtn").addEventListener("click", () => {
  store.set("lib-key", null); videos = []; dispatch = null; location.hash = ""; lockScreen();
});

/* ---------- encrypted files (older videos may still be plain links until the library is updated) */
const refPath = ref => typeof ref === "string" ? ref : ref.path;
const with911 = name => /911video/i.test(name) ? name : "911video - " + name;   // every download says 911video
async function fileURL(path, type){
  if (/^https?:/.test(path)) return path;                     // plain link: use as is
  if (blobCache[path]) return blobCache[path];
  const r = await fetch(vaultBase + path + "?v=" + encodeURIComponent(box.iv), {cache: "force-cache"});
  if (!r.ok) throw new Error("file not found (" + r.status + ")");
  const buf = new Uint8Array(await r.arrayBuffer());
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, libKey, buf.slice(12));
  return (blobCache[path] = URL.createObjectURL(new Blob([plain], {type})));
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-dl]");
  if (!b) return;
  const v = videos.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
  let f = v && v.files[b.dataset.dl];
  if (Array.isArray(f)) f = f[Number(b.dataset.i) || 0];
  if (!f) return;
  const label = b.querySelector("span"), old = label.textContent;
  b.disabled = true; label.textContent = "Unlocking file…";
  try {
    const a = document.createElement("a");
    a.href = await fileURL(refPath(f), f.type || ""); a.download = with911(f.name || `${v.site || "video"} - ${b.dataset.dl}` +
      ({video: ".mp4", thumbnail: ".jpg", thumbnails: ".jpg", captions: ".srt", kit: ".md"}[b.dataset.dl] || ""));
    document.body.appendChild(a); a.click(); a.remove();
    label.textContent = "Downloaded ✓";
  } catch (err) { label.textContent = "Failed — try again"; console.error(err); }
  setTimeout(() => { label.textContent = old; b.disabled = false; }, 2500);
});

/* ---------- upload to YouTube */
async function runWorkflow(file, inputs){
  const r = await fetch(`https://api.github.com/repos/${dispatch.repo}/actions/workflows/${file}/dispatches`, {
    method: "POST",
    headers: {"Authorization": "Bearer " + dispatch.token, "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"},
    body: JSON.stringify({ref: dispatch.ref, inputs})
  });
  if (r.status !== 204) throw new Error(`GitHub said ${r.status}: ${(await r.text()).slice(0, 160)}`);
}
document.addEventListener("click", async e => {
  if (!e.target.closest("#ytup")) return;
  const v = videos.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
  if (!v) return;
  if (!dispatch || !dispatch.token) { alert("The button isn't connected yet: add the DISPATCH_TOKEN secret first."); return; }
  const ok = confirm(`Upload “${v.title}” to your YouTube channel?\n\n` +
    "It goes up as UNLISTED with its title, description, tags, thumbnail and captions.\n" +
    "Note: until YouTube approves your API audit, uploads are locked to private.");
  if (!ok) return;
  const b = e.target.closest("#ytup");
  b.disabled = true; b.textContent = "Starting upload…";
  try {
    await runWorkflow("upload-one.yml", {video_id: v.id});
    watching = "upload-one.yml";
    b.textContent = "Uploading… (a few minutes)";
    showStatus(`<span class="spinner"></span> Uploading “${esc(v.title)}” to YouTube…`);
    setTimeout(checkRuns, 6000);
  } catch (err) { b.disabled = false; b.textContent = "▶ Upload to YouTube"; alert("Couldn't start: " + err.message); }
});

/* ---------- generate new videos */
const dlg = document.getElementById("dlg"), countEl = document.getElementById("count");
const customEl = document.getElementById("custom");
const clamp = n => Math.max(0, Math.min(30, Math.round(Number(n) || 0)));
function customURL(){
  const v = customEl.value.trim();
  if (!v) return "";
  try { const u = new URL(/^https?:\/\//i.test(v) ? v : "https://" + v); return u.hostname.includes(".") ? u.href : null; }
  catch { return null; }
}
function updateEta(){
  const n = clamp(countEl.value) + (customURL() ? 1 : 0), par = Number(document.getElementById("parallel").value);
  if (!n) { document.getElementById("eta").textContent = "Choose at least 1 video or type a website."; return; }
  const mins = Math.round(Math.ceil(n / par) * 7 + 4);
  document.getElementById("eta").textContent = `About ${mins} minutes for ${n} video${n === 1 ? "" : "s"}. ` +
    "They appear on this page when they are done; sites that block visitors are skipped.";
}
document.getElementById("gen").addEventListener("click", () => {
  document.getElementById("dlgerr").textContent = "";
  updateEta(); dlg.showModal();
});
dlg.addEventListener("click", e => {
  const step = e.target.closest("[data-step]");
  if (step) { countEl.value = clamp(Number(countEl.value) + Number(step.dataset.step)); updateEta(); }
});
countEl.addEventListener("input", updateEta);
customEl.addEventListener("input", updateEta);
document.getElementById("parallel").addEventListener("change", updateEta);
document.getElementById("cancel").addEventListener("click", () => dlg.close());
document.getElementById("start").addEventListener("click", async () => {
  const q = clamp(countEl.value), par = document.getElementById("parallel").value, url = customURL();
  const err = document.getElementById("dlgerr"), btn = document.getElementById("start");
  if (url === null) { err.textContent = "That website address doesn't look right."; return; }
  const n = q + (url ? 1 : 0);
  if (!n) { err.textContent = "Choose at least 1 video or type a website."; return; }
  if (!dispatch || !dispatch.token) {
    err.innerHTML = 'The button isn\'t connected yet (no GitHub token). For now start it on GitHub: ' +
      '<a href="https://github.com/renekmarken/yta/actions/workflows/batch.yml" target="_blank" rel="noopener">Run workflow</a>.';
    return;
  }
  btn.disabled = true; btn.textContent = "Starting…"; err.textContent = "";
  try {
    await runWorkflow("batch.yml", {count: String(q), url: url || "", parallel: String(par)});
    watching = "batch.yml";
    dlg.close();
    customEl.value = "";
    showStatus(`<span class="spinner"></span> Starting ${n} new video${n === 1 ? "" : "s"}…`);
    setTimeout(checkRuns, 6000);
  } catch (e) {
    err.textContent = "Couldn't start: " + e.message;
  } finally { btn.disabled = false; btn.textContent = "Start"; }
});

function showStatus(html){
  const el = document.getElementById("status");
  el.innerHTML = html; el.classList.toggle("on", !!html);
}
let pollTimer = null, watching = null;
async function checkRuns(){
  clearTimeout(pollTimer);
  if (!dispatch || !dispatch.token) return;
  try {
    const latest = async file => {
      const r = await fetch(`https://api.github.com/repos/${dispatch.repo}/actions/workflows/${file}/runs?per_page=1`,
        {headers: {"Authorization": "Bearer " + dispatch.token, "Accept": "application/vnd.github+json"}});
      return r.ok ? (await r.json()).workflow_runs?.[0] : null;
    };
    const files = watching ? [watching, "library-backfill.yml"] : ["batch.yml", "upload-one.yml", "library-backfill.yml"];
    const runs = (await Promise.all(files.map(latest))).filter(Boolean)
      .filter(r => !(r.event === "schedule" && r.status === "completed"));   // quiet hourly safety-net runs
    runs.sort((a, b) => (a.status === "completed") - (b.status === "completed") || new Date(b.updated_at) - new Date(a.updated_at));
    const run = runs[0];
    const what = !run ? "" : run.path.includes("upload-one") ? "Uploading to YouTube"
               : run.path.includes("library-backfill") ? "Adding the new videos to the library" : "Making videos";
    if (!run) return showStatus("");
    const age = (Date.now() - new Date(run.updated_at)) / 60000;
    if (run.status !== "completed") {
      const mins = Math.round((Date.now() - new Date(run.run_started_at || run.created_at)) / 60000);
      showStatus(`<span class="spinner"></span> ${what}… (${mins} min so far) · <a href="${esc(run.html_url)}" target="_blank" rel="noopener">details</a>`);
      pollTimer = setTimeout(checkRuns, 30000);
    } else if (age < 30 && store.get("dismissed-run") !== String(run.id)) {
      const ok = run.conclusion === "success";
      const close = `<button class="xbtn" data-dismiss="${run.id}" aria-label="Dismiss">✕</button>`;
      if (ok && what === "Making videos") {           // the library update starts right after
        showStatus(`<span class="spinner"></span> Adding the new videos to the library…`);
        pollTimer = setTimeout(checkRuns, 20000);
      } else showStatus((ok ? `✅ ${what === "Uploading to YouTube" ? "Uploaded to YouTube" : "New videos are in the library"} — <a href="#" onclick="location.reload();return false">refresh the page</a> to see them.`
                    : `⚠️ The last run finished with problems · <a href="${esc(run.html_url)}" target="_blank" rel="noopener">details</a>`) + close);
    } else showStatus("");
  } catch { /* status is optional */ }
}

document.getElementById("search").addEventListener("input", route);
window.addEventListener("hashchange", route);
load();
</script>
