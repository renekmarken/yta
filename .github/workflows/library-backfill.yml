name: Update the video library

# The ONE place where finished videos go into the private, encrypted library (with their thumbnails,
# captions and upload kit). Every video run keeps its files as temporary "911video-..." downloads and
# then starts this workflow; it also runs every hour as a safety net, so anything a run left behind
# (for example after a GitHub hiccup) is picked up automatically. The temporary downloads are deleted
# only after the encrypted copies were saved AND verified on GitHub.
#
# Run it by hand after changing the LIBRARY_PASSWORD or DISPATCH_TOKEN secrets (leave the boxes empty).

on:
  schedule:
    - cron: "47 * * * *"       # hourly safety net
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Optional: video run IDs to add (comma-separated). Empty = everything waiting."
        required: false
        default: ""
      mark_uploaded:
        description: "Optional: mark videos as uploaded (brand names, comma-separated)"
        required: false
        default: ""
      set_uploaded:
        description: "Used by the library page's 'I've uploaded this one' box (video ids; -id = not uploaded)"
        required: false
        default: ""
      remove_lost:
        description: "Optional: remove videos whose files were lost (brand names, comma-separated)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: library               # one library update at a time; never cancels a video run
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Find finished videos waiting for the library
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
          REPO: ${{ github.repository }}
        run: |
          ids=""
          for id in $(echo "$RUN_IDS" | tr ',' ' '); do ids="$ids $(echo "$id" | tr -cd '0-9')"; done
          # every finished run that still has videos waiting
          for id in $(gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
                        --jq '.artifacts[] | select((.name | startswith("911video")) and (.expired | not)) | .workflow_run.id' | sort -u); do
            [ "$(gh api "repos/$REPO/actions/runs/$id" --jq .status)" = completed ] && ids="$ids $id"
          done
          ids=$(echo $ids | tr ' ' '\n' | grep . | sort -u | tr '\n' ' ' || true)
          echo "Runs with videos to add: ${ids:-none}"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Add them to the library (encrypted)
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.find.outputs.ids }}
          MARK: ${{ inputs.mark_uploaded }}
          SETUP: ${{ inputs.set_uploaded }}
          REMOVE: ${{ inputs.remove_lost }}
          LIBRARY_PASSWORD: ${{ secrets.LIBRARY_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LIBRARY_REF: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git pull -q --ff-only || true                      # newest library list
          tools/vault.sh pull
          for id in $IDS; do
            rm -rf incoming
            gh run download "$id" -D incoming -p "911video*" || { echo "run $id: nothing to download"; continue; }
            python tools/library.py add incoming "run-$id"
          done
          python tools/library.py migrate
          if [ -n "$MARK" ]; then python tools/library.py mark-uploaded "$MARK"; fi
          if [ -n "$SETUP" ]; then python tools/library.py set-uploaded "$SETUP"; fi
          # marks saved by the page (save-marks.yml), oldest first; applied files are removed in this commit
          for f in $(ls data/marks/*.txt 2>/dev/null | sort -V); do
            python tools/library.py set-uploaded "$(cat "$f")" && git rm -q "$f"
          done
          if [ -n "$REMOVE" ]; then python tools/library.py remove-lost "$REMOVE"; fi
          tools/vault.sh push                                # exits 1 unless GitHub really has the files
          git add -A docs/videos/ data/marks/ 2>/dev/null || git add -A docs/videos/
          git commit -qm "Video library: update" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Tell your phone (ntfy)
        if: success() && hashFiles('added.txt') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
        run: |
          [ -s added.txt ] || exit 0
          if [ -z "$NTFY_TOPIC" ]; then echo "::warning::No NTFY_TOPIC secret, so no phone notification"; exit 0; fi
          n=$(wc -l < added.txt)
          curl -sS -o /dev/null -w "ntfy: HTTP %{http_code}\n" \
            -H "Title: $n new video(s) in your library" -H "Tags: movie_camera" \
            -H "Click: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/videos/" \
            --data-binary @added.txt "https://ntfy.sh/$NTFY_TOPIC"
      - name: Delete the temporary downloads (the library has verified copies now)
        if: success() && steps.find.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.find.outputs.ids }}
          REPO: ${{ github.repository }}
        run: |
          for id in $IDS; do
            gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name | startswith("911video")) | .id' \
              | while read -r a; do gh api -X DELETE "repos/$REPO/actions/artifacts/$a"; done
          done
