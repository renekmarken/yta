name: Check YouTube connection

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth requests
      - name: Sign in to YouTube and show the channel
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'manual' }}
        run: python tools/check_youtube.py
