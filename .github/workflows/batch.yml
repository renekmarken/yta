name: Make a batch of videos

# Actions tab → "Make a batch of videos" → Run workflow → choose how many.
# 1) picks that many products from the queue (never ones already reviewed), plus the optional
#    website you type in (made even if it isn't in the queue),
# 2) makes them in parallel, each in its own job,
# 3) books everything and hands the videos to "Update the video library", which adds them
#    (with thumbnails) to your private library.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos from the queue? (0-30; 0 = only the website below)"
        type: number
        required: true
        default: 5
      url:
        description: "Optional: also review these websites (outside the queue, space-separated)"
        required: false
        default: ""
      topics:
        description: 'Optional: your own, as JSON. Risk Cases [{"product": "Instagram", "issue": "..."}]; White Screen [{"title": "", "instructions": "..."}]'
        required: false
        default: ""
      kind:
        description: "What to make"
        type: choice
        options: ["review", "risk", "whitescreen"]
        default: "review"
      parallel:
        description: "How many to make at the same time"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "2"

permissions:
  contents: write
  actions: write

concurrency:
  group: data-writer
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 25
    outputs:
      items: ${{ steps.plan.outputs.items }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4
      - name: Pick the products
        id: plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          COUNT: ${{ inputs.count }}
          CUSTOM_URL: ${{ inputs.url }}
          KIND: ${{ inputs.kind }}
          TOPICS: ${{ inputs.topics }}
        run: |
          min=1; [ -n "$CUSTOM_URL$TOPICS" ] && min=0
          n=$(( COUNT < min ? min : (COUNT > 30 ? 30 : COUNT) ))
          python run.py --plan "$n" --plan-url "$CUSTOM_URL" --plan-topics "$TOPICS" --kind "${KIND:-review}" --plan-out plan.json
          echo "items=$(python -c 'import json;print(json.dumps(json.load(open("plan.json"))))')" >> "$GITHUB_OUTPUT"
          echo "total=$(python -c 'import json;print(len(json.load(open("plan.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Save queue changes
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "Update review queue (batch plan)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

  make:
    needs: plan
    if: needs.plan.outputs.total != '0'
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    name: "Video ${{ matrix.item.n }}: ${{ matrix.item.name }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg, Python packages and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          pip install "piper-tts>=1.2" || echo "Piper backup voice not available (Edge voice still works)"
      - name: Cache backup voice model
        uses: actions/cache@v5
        with:
          path: .cache/piper
          key: piper-${{ vars.PIPER_VOICE || 'en_US-lessac-high' }}
      - name: Get extra fonts
        run: python tools/get_fonts.py
      - name: Make the video
        env:
          ITEM: ${{ toJSON(matrix.item) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'manual' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'unlisted' }}
          YT_PUBLISH_DELAY_HOURS: ${{ vars.YT_PUBLISH_DELAY_HOURS }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Secret' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AvaMultilingualNeural' }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          PIPER_VOICE: ${{ vars.PIPER_VOICE }}
          MUSIC: ${{ vars.MUSIC }}
          SFX: ${{ vars.SFX }}
        run: python run.py --item "$ITEM"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 911video-${{ matrix.item.n }}
          path: |
            output/*/*.mp4
            output/*/*thumbnail*.jpg
            output/*/captions.srt
            output/*/UPLOAD_KIT.md
            output/*/metadata.json
            output/*/script.json
            output/*/story.png
            output/*/site.json
            output/*/*.png
            output/*/logo.svg
            output/*/result.json
          retention-days: 7              # deleted as soon as the library has verified copies
          if-no-files-found: ignore

  save:
    needs: [plan, make]
    if: always() && needs.plan.outputs.total != '0'
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 cryptography
      - name: Collect the videos
        uses: actions/download-artifact@v7
        with:
          pattern: 911video-*
          path: results
      - name: Book them (queue, history, never-review-again list) and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          RELEASE_URL: https://renekmarken.github.io/yta/videos/
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'manual' }}
        run: python run.py --apply-results results
      - name: Save progress
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "Book batch of ${{ needs.plan.outputs.total }} videos"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Put them in the video library
        if: always()                     # even if booking failed; the library step only needs the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run library-backfill.yml --ref "${{ github.ref_name }}" -f run_ids="${{ github.run_id }}"
