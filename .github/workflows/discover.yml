name: Discover trending products

on:
  schedule:
    - cron: "41 */3 * * *"     # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"         # show progress in the live log

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4
      - name: Find new / hot products and rank the queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python discover.py
      - name: Save queue
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update review queue"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
