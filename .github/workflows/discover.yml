name: Discover trending products

# Every DISCOVER_EVERY_HOURS hours (repository variable, default 6, so 4 searches a day): scans launch
# sites and news for products launched today / this week (plus trends, charts and an evergreen
# backlog) and ranks the queue with new launches first. Every hour: starts a batch of review videos
# from the top of the queue, up to UPLOADS_PER_DAY (default 50) a day. With
# UPLOAD_MODE=api each video goes to YouTube (unlisted) as soon as it's done.
# Turn it off: set the repository variable UPLOADS_PER_DAY to 0.

on:
  schedule:
    # Hourly. GitHub drops many scheduled runs when it's busy, so it is asked four times an hour
    # and the first step skips the run if the queue was already updated in the last 55 minutes.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write               # to start "Make a batch of videos" for new launches

env:
  PYTHONUNBUFFERED: "1"         # show progress in the live log

concurrency:
  group: discover              # its own group, so it never cancels a waiting video run
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Due? (last run over 55 minutes ago; product search every few hours)
        id: due
        run: |
          last=$(cat data/discover_last_run.txt 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$age" -ge 3300 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "last update ${age}s ago: updating the queue"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "updated ${age}s ago: nothing to do yet"
          fi
          every=$(( ${{ vars.DISCOVER_EVERY_HOURS || 6 }} * 3600 - 300 ))
          searched=$(cat data/search_last_run.txt 2>/dev/null || echo 0)
          sage=$(( $(date +%s) - searched ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$sage" -ge "$every" ]; then
            echo "search=yes" >> "$GITHUB_OUTPUT"; echo "last product search ${sage}s ago: searching now"
          else
            echo "search=no" >> "$GITHUB_OUTPUT"; echo "last product search ${sage}s ago: not searching this hour"
          fi
      - uses: actions/setup-python@v6
        if: steps.due.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4
        if: steps.due.outputs.run == 'yes'
      - name: Find new launches / hot products and rank the queue
        if: steps.due.outputs.run == 'yes' && steps.due.outputs.search == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python discover.py
      - name: How many videos to start now
        if: steps.due.outputs.run == 'yes'
        id: auto
        env:
          UPLOADS_PER_DAY: ${{ vars.UPLOADS_PER_DAY }}
          AUTO_VIDEOS_PER_RUN: ${{ vars.AUTO_VIDEOS_PER_RUN }}
        run: python tools/auto_launch.py
      - name: Save queue
        if: steps.due.outputs.run == 'yes'
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          date +%s > data/discover_last_run.txt
          if [ "${{ steps.due.outputs.search }}" = "yes" ]; then date +%s > data/search_last_run.txt; fi
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update review queue"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Start the videos
        if: steps.due.outputs.run == 'yes' && steps.auto.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.auto.outputs.count }}
        run: gh workflow run batch.yml --ref "${{ github.ref_name }}" -f count="$COUNT" -f kind=review -f parallel=4
