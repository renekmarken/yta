name: Discover trending products

# Every hour: scans launch sites and news for products launched today / this week (plus trends,
# charts and an evergreen backlog), ranks the queue with new launches first, and immediately
# used to start videos for fresh launches by itself. That is OFF (turned off on request): it only
# updates the queue now. To turn automatic videos back on, remove `if: false` from "Start the videos".

on:
  schedule:
    # Hourly. GitHub drops many scheduled runs when it's busy, so it is asked four times an hour
    # and the first step skips the run if the queue was already updated in the last 55 minutes.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write               # to start "Make a batch of videos" for new launches

env:
  PYTHONUNBUFFERED: "1"         # show progress in the live log

concurrency:
  group: discover              # its own group, so it never cancels a waiting video run
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Due? (last update over 55 minutes ago)
        id: due
        run: |
          last=$(cat data/discover_last_run.txt 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$age" -ge 3300 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "last update ${age}s ago: updating the queue"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "updated ${age}s ago: nothing to do yet"
          fi
      - uses: actions/setup-python@v6
        if: steps.due.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4
        if: steps.due.outputs.run == 'yes'
      - name: Find new launches / hot products and rank the queue
        if: steps.due.outputs.run == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python discover.py
      - name: Pick fresh launches to make right now
        if: false            # automatic videos are OFF
        id: auto
        env:
          AUTO_VIDEOS_PER_DAY: ${{ vars.AUTO_VIDEOS_PER_DAY }}
          AUTO_MIN_HOTNESS: ${{ vars.AUTO_MIN_HOTNESS }}
        run: python tools/auto_launch.py
      - name: Save queue
        if: steps.due.outputs.run == 'yes'
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          date +%s > data/discover_last_run.txt
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update review queue"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Start the videos
        if: false            # automatic videos are OFF; was: steps.auto.outputs.urls != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URLS: ${{ steps.auto.outputs.urls }}
        run: gh workflow run batch.yml --ref "${{ github.ref_name }}" -f count=0 -f url="$URLS" -f parallel=2
